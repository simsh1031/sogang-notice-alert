
name: Sogang Notice Monitor

on:
  schedule:
    - cron: "0,30 * * * *"

  workflow_dispatch:
    inputs:
      test_webhook:
        description: "Discord 연결만 테스트"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sogang-notice-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Monitor notices
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_WEBHOOK: ${{ inputs.test_webhook }}
        run: |
          if [ "$TEST_WEBHOOK" = "true" ]; then
            python monitor.py --test-webhook
          else
            python monitor.py
          fi

      - name: Commit updated state
        if: ${{ inputs.test_webhook != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_posts.json

          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "chore: update seen notices"
            git push
          fi
